name: Understudy CI

# Scoped to understudy/ on purpose. The NOVERA app at the repo root is a
# separate project with its own history and is deliberately not built here.
on:
  push:
    branches: [main]
    paths: ["understudy/**", ".github/workflows/understudy-ci.yml"]
  pull_request:
    paths: ["understudy/**", ".github/workflows/understudy-ci.yml"]

defaults:
  run:
    working-directory: understudy

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: understudy/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
