name: Understudy Deploy

# Deploys the landing page to Vercel from GitHub's runners.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   VERCEL_TOKEN       vercel.com/account/tokens
#   VERCEL_ORG_ID      from understudy/.vercel/project.json after `vercel link`
#   VERCEL_PROJECT_ID  same file
#
# Set DATABASE_URL in the Vercel project's own environment variables, NOT
# here — the app refuses to accept signups on Vercel without it, by design
# (see src/lib/server/storage/ephemeral.ts).
on:
  push:
    branches: [main]
    paths: ["understudy/**", ".github/workflows/understudy-deploy.yml"]
  workflow_dispatch:

concurrency:
  group: understudy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: understudy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: understudy/package-lock.json

      - name: Fail early if the deploy secrets are missing
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          missing=""
          [ -z "$VERCEL_TOKEN" ] && missing="$missing VERCEL_TOKEN"
          [ -z "$VERCEL_ORG_ID" ] && missing="$missing VERCEL_ORG_ID"
          [ -z "$VERCEL_PROJECT_ID" ] && missing="$missing VERCEL_PROJECT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            echo "See understudy/README.md -> Going live."
            exit 1
          fi

      - run: npm ci

      # Verify before shipping: a broken deploy is worse than a late one.
      - run: npm run lint
      - run: npm run typecheck

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Pull Vercel project settings
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        id: deploy
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url"

      - name: Check the waitlist is actually storing signups
        run: |
          url="${{ steps.deploy.outputs.url }}"
          code=$(curl -s -o /tmp/body -w "%{http_code}" -X POST "$url/api/waitlist" \
            -H 'Content-Type: application/json' \
            -H 'x-forwarded-for: 203.0.113.1' \
            -d '{"email":"deploy-check@understudy.invalid","source":"hero"}')
          echo "POST /api/waitlist -> $code"; cat /tmp/body; echo
          if [ "$code" = "503" ]; then
            echo "::error::Deployed, but the waitlist has no database. Set DATABASE_URL in the Vercel project, then re-run."
            exit 1
          fi
          if [ "$code" != "200" ]; then
            echo "::error::Waitlist endpoint returned $code."
            exit 1
          fi
          echo "Waitlist is accepting signups. Remove the deploy-check@understudy.invalid row from /admin."
